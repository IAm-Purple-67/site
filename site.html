<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X4G Panel · پروژه جدید</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #e0e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 60%),
                              radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
        }
        .card {
            background: rgba(16, 24, 40, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 60px rgba(59, 130, 246, 0.08);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 40px;
            border: none;
            border-radius: 60px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.3);
            letter-spacing: 0.3px;
        }
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn i {
            margin-left: 8px;
        }
        .info {
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid rgba(59, 130, 246, 0.1);
            padding-top: 20px;
        }
        .info a {
            color: #818cf8;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            color: #93bbfc;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🚀</span>
        <div class="badge">جدیدترین نسخه</div>
        <h1>X4G Panel</h1>
        <p>
            پروژه‌ی جدید <strong>X4G</strong> با آخرین آپدیت‌ها و بهبودهای عملکردی.
            برای استفاده، روی دکمه زیر کلیک کنید و پروژه را فورک یا مشاهده کنید.
        </p>
        <a href="https://github.com/IAm-Purple-67/X4G-" target="_blank" class="btn">
            <i>🔗</i> مشاهده پروژه در گیت‌هاب
        </a>
        <div class="info">
            <span>📅 آخرین بروزرسانی: ۱۳ مرداد ۱۴۰۵</span><br>
            <span>👤 توسط <a href="https://github.com/IAm-Purple-67" target="_blank">IAm-Purple-67</a></span>
        </div>
    </div>
</body>
</html>
